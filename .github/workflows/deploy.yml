name: Publicar DIRCE TEC no Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dircetec-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar e publicar DIRCE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir páginas e arquivos
        run: npm run check

      - name: Verificar conexão segura com Cloudflare
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CF_TOKEN_PRESENT" ] || [ -z "$CF_ACCOUNT_PRESENT" ]; then
            echo "::error::A publicação precisa dos secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions deste repositório. Nunca adicione esses valores ao código."
            exit 1
          fi

      - name: Diagnosticar token e conta Cloudflare sem expor segredos
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_API_TOKEN?.trim() || '';
          const account = process.env.CF_ACCOUNT_ID?.trim() || '';
          if (!/^[a-f0-9]{32}$/i.test(account)) {
            console.error('::error::CLOUDFLARE_ACCOUNT_ID precisa ser um identificador de conta Cloudflare com 32 caracteres hexadecimais, não o Zone ID.');
            process.exit(1);
          }
          async function check(url) {
            try {
              const r = await fetch(url, {headers: {Authorization: 'Bearer ' + token}});
              const j = await r.json();
              return {http: r.status, success: j.success === true, status: j.result?.status ?? null, codes: (j.errors || []).map(e => e.code).filter(Boolean)};
            } catch(e) {
              return {http: 0, success: false, status: null, codes: ['network_error']};
            }
          }
          const verified = await check('https://api.cloudflare.com/client/v4/user/tokens/verify');
          console.log('Token Cloudflare: ' + (verified.success && verified.status === 'active' ? 'ATIVO' : 'NAO VALIDADO') + ' (HTTP ' + verified.http + ')');
          if (!verified.success || verified.status !== 'active') {
            console.error('::error::O token Cloudflare nao esta ativo ou nao pode ser verificado. Revise CLOUDFLARE_API_TOKEN.');
            process.exit(1);
          }
          const scripts = await check('https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts');
          console.log('Acesso a Workers na conta selecionada: ' + (scripts.success ? 'AUTORIZADO' : 'NEGADO') + ' (HTTP ' + scripts.http + '; codigos: ' + scripts.codes.join(',') + ')');
          if (!scripts.success) {
            console.error('::error::Sem acesso a Workers nessa conta. Confira se CLOUDFLARE_ACCOUNT_ID pertence a conta escolhida no token e se ele tem Account > Workers Scripts > Edit nessa conta.');
            process.exit(1);
          }
          NODE

      - name: Publicar Worker dircetec
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
